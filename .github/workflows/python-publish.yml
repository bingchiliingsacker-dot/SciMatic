name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  MANIFEST_PATH: rs_scimatic/Cargo.toml
  # Interpreter used to drive the build tooling. Which wheels get built is decided
  # by `requires-python` in pyproject.toml (maturin --find-interpreter) and by the
  # CIBW_BUILD globs for Android.
  TOOLING_PYTHON: "3.14"
  # Pythons installed on macOS/Windows runners so maturin can build a wheel per version.
  # Linux builds use the interpreters bundled in the manylinux/musllinux containers.
  WHEEL_PYTHONS: |
    3.10
    3.11
    3.12
    3.13
    3.14

jobs:
  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc)
          - { name: linux-x86_64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,     manylinux: auto }
          - { name: linux-aarch64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,    manylinux: auto }
          # Linux (musl)
          - { name: musllinux-x86_64,  os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          # macOS
          - { name: macos-x86_64,    os: macos-15-intel,   target: x86_64-apple-darwin }
          - { name: macos-arm64,     os: macos-latest,     target: aarch64-apple-darwin }
          # Windows
          - { name: windows-x64,     os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: ${{ env.WHEEL_PYTHONS }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist --find-interpreter --manifest-path ${{ env.MANIFEST_PATH }}
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists-wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ${{ env.MANIFEST_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Wheels (android)
    runs-on: ubuntu-latest
    env:
      CIBW_PLATFORM: android
      CIBW_ARCHS: arm64_v8a
      CIBW_BUILD: "cp313-* cp314-*"
      CIBW_BUILD_VERBOSITY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.TOOLING_PYTHON }}

      # The Rust std library for the Android target must be installed on the host.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android wheels
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists-android
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist, android]
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/