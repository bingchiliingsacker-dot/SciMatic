name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:

  release-build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build release distributions
        run: maturin build --release

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-${{ matrix.os }}
          path: target/wheels/


  android-arm64-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust Android target
        run: |
          rustup target add aarch64-linux-android

      - name: Configure Android linker
        run: |
          mkdir -p .cargo

          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android21-clang"
          EOF

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build Android ARM64 wheel
        env:
          ANDROID_API_LEVEL: "21"
        run: |
          maturin build \
            --release \
            --target aarch64-linux-android \
            --compatibility off

      - name: Upload Android ARM64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-android-arm64
          path: target/wheels/


  pypi-publish:
    runs-on: ubuntu-latest

    needs:
      - release-build
      - android-arm64-build

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
