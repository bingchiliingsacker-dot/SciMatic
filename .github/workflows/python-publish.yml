name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build release distributions
        run: |
          maturin build --release --manifest-path rs_scimatic/Cargo.toml
          maturin sdist --manifest-path rs_scimatic/Cargo.toml

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-${{ matrix.os }}
          path: target/wheels/

  android-build:
    runs-on: ubuntu-latest

    env:
      ANDROID_API_LEVEL: 24

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build Android wheels
        run: |
          python -m cibuildwheel \
            --platform android \
            --archs arm64_v8a \
            --output-dir wheelhouse

      - name: Upload Android wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-android
          path: wheelhouse/*.whl

  pypi-publish:
    runs-on: ubuntu-latest

    needs:
      - release-build
      - android-build

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/